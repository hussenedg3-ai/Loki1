<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Someone Is Wearing Your Face</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root { --navy:#130e31; --red:#c70c10; --cream:#f7f2e9; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#080711; font-family:"Anton",Arial,sans-serif; }
    .poster {
      position:relative; width:100%; height:100%; min-height:620px;
      background:var(--navy); color:var(--cream); overflow:hidden;
      isolation:isolate;
    }
    .poster::before {
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(ellipse at 20% 38%,rgba(70,58,125,.16),transparent 35%),
        radial-gradient(ellipse at 86% 72%,rgba(0,0,0,.22),transparent 38%),
        linear-gradient(115deg,rgba(255,255,255,.018),transparent 48%);
      z-index:-1;
    }
    .zigzag {
      position:absolute; left:-1.5%; top:-6px; width:103%; height:84px;
      background:var(--cream);
      clip-path:polygon(0 0,100% 0,100% 15%,96.5% 15%,96.5% 41%,92.5% 41%,92.5% 15%,87.8% 15%,87.8% 70%,84.3% 70%,84.3% 41%,79.7% 41%,79.7% 15%,75.2% 15%,75.2% 70%,71.7% 70%,71.7% 41%,67.1% 41%,67.1% 15%,62.5% 15%,62.5% 70%,59% 70%,59% 41%,54.4% 41%,54.4% 15%,49.8% 15%,49.8% 70%,46.3% 70%,46.3% 41%,41.7% 41%,41.7% 15%,37.1% 15%,37.1% 70%,33.6% 70%,33.6% 41%,29% 41%,29% 15%,24.4% 15%,24.4% 70%,20.9% 70%,20.9% 41%,16.3% 41%,16.3% 15%,11.7% 15%,11.7% 70%,8.2% 70%,8.2% 41%,3.6% 41%,3.6% 15%,0 15%);
      filter:drop-shadow(0 5px 0 rgba(199,12,16,.95));
      animation:scrape 1.1s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes scrape { from { transform:translateY(-90px); } to { transform:translateY(0); } }

    .copy { position:absolute; left:5.4%; top:26%; width:90%; }
    .line {
      margin:0; font-size:clamp(72px,10.3vw,168px); line-height:.99;
      letter-spacing:-.025em; text-transform:uppercase;
      transform:scaleX(.86); transform-origin:left center;
      white-space:nowrap;
    }
    .line1 { animation:reveal 700ms 180ms both; }
    .line2 { animation:reveal 700ms 380ms both; }
    .line3 {
      color:#fff6ef; position:relative; z-index:3;
      animation:reveal 700ms 580ms both;
    }
    @keyframes reveal {
      from { opacity:0; transform:translateX(-55px) scaleX(.86); }
      to { opacity:1; transform:translateX(0) scaleX(.86); }
    }

    .red-band {
      position:absolute; z-index:2; left:-2%; top:53.2%; width:102%; height:25%;
      background:linear-gradient(180deg,#c70b10,#9d080c);
      clip-path:polygon(0 34%,3% 20%,7% 25%,11% 8%,15% 18%,19% 10%,23% 30%,27% 12%,31% 18%,35% 7%,39% 22%,43% 13%,47% 27%,51% 14%,55% 23%,59% 10%,63% 20%,67% 8%,71% 24%,75% 12%,79% 19%,83% 8%,87% 23%,91% 11%,95% 21%,100% 8%,100% 100%,0 100%);
      opacity:.97;
      animation:band-in 900ms 650ms cubic-bezier(.2,.75,.2,1) both;
    }
    @keyframes band-in { from { transform:translateY(130%); } to { transform:translateY(0); } }

    .subtitle {
      position:absolute; z-index:5; left:5.4%; top:77.2%;
      margin:0; font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(20px,2.45vw,38px); font-weight:700;
      letter-spacing:.01em; color:#f4f1ec;
      animation:fade-up 700ms 1.15s both;
    }
    @keyframes fade-up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

    .qr-wrap {
      position:absolute; z-index:8; right:4.5%; bottom:5.4%;
      display:flex; align-items:flex-end; gap:12px;
      color:rgba(247,242,233,.72);
      animation:fade-up 700ms 1.45s both;
    }
    #qrcode { width:82px; height:82px; padding:5px; background:#fff; }
    #qrcode img, #qrcode canvas { display:block; }
    .qr-label { font-family:"Oswald",sans-serif; font-size:13px; line-height:1.05; text-transform:uppercase; max-width:80px; }

    .grain {
      position:absolute; inset:0; pointer-events:none; opacity:.055;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%28n%29)' opacity='.7'/%3E%3C/svg%3E");
      mix-blend-mode:screen;
    }

    @media (max-aspect-ratio:3/4) {
      .poster { min-height:520px; }
      .copy { top:28%; }
      .line { font-size:clamp(55px,15.5vw,100px); }
      .red-band { top:49%; height:27%; }
      .subtitle { top:78%; font-size:clamp(16px,4.5vw,24px); }
      .qr-wrap { right:5%; bottom:3.5%; }
      #qrcode { width:68px; height:68px; }
    }
  </style>
</head>
<body>
  <main class="poster" role="img" aria-label="Someone is wearing your face. Internet crime: identity theft.">
    <div class="zigzag"></div>
    <section class="copy">
      <h1 class="line line1">Someone</h1>
      <h1 class="line line2">is wearing</h1>
      <h1 class="line line3">your face.</h1>
    </section>
    <div class="red-band"></div>
    <p class="subtitle">Internet crime: identity theft.</p>
    <div class="qr-wrap">
      <div id="qrcode" aria-label="QR code linking to this animation"></div>
      <div class="qr-label">Scan<br>the message</div>
    </div>
    <div class="grain"></div>
  </main>
  <script>
    const qrTarget = "https://hussenedg3-ai.github.io/Loki1/";
    new QRCode(document.getElementById("qrcode"), {
      text: qrTarget,
      width: 72,
      height: 72,
      colorDark: "#100c25",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
